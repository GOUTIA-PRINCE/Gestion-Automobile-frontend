<div class="bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center">

  <!-- Bouton hamburger (mobile) -->
  <button class="btn btn-outline-secondary d-md-none me-3"
          data-bs-toggle="offcanvas"
          data-bs-target="#mobileSidebar">
    <i class="bi bi-list"></i>k
  </button>

  <div>
    <h5 class="mb-0 fw-bold">Tableau de bord</h5>
    <small class="text-muted">Vue d’ensemble de votre parc automobile</small>
  </div>
  <!-- barre de recherche  -->
   <div class="d-flex align-items-center gap-4">
        <div class="position-relative d-none d-md-block">
            <!-- Icône recherche -->
            <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
            
            <!-- Input -->
            <input
            type="text"
            class="form-control ps-5"
            placeholder="Rechercher..."
            style="width: 16rem;"
            />
        </div>
        <!--bouton pour filtrer les rechercher en fonctions des criteres -->
        <button class="btn btn-outline-secondary">
        <i class="bi bi-funnel"></i>
      </button>
    </div>
  <div class="d-flex align-items-center gap-3">
    <!-- Bouton Dark / Light -->
    <button class="btn btn-outline-secondary"
            (click)="toggleTheme()">
      <i class="bi" [ngClass]="isDark ? 'bi-sun' : 'bi-moon'"></i>.
    </button>

    <!-- Notification -->
    <div class="position-relative">
      <i class="bi bi-bell fs-5"></i>
      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
        4
      </span>
    </div>

    <!-- Profil -->
    <div class="d-flex align-items-center gap-2">
      <div class="rounded-circle bg-dark text-white px-2 py-1">AD</div>
      <div class="d-none d-md-block">
        <strong>GOUTIA</strong><br>
        <small class="text-muted">Administrateur</small>
      </div>
    </div>
  </div>
</div>

<!-- Sidebar mobile (offcanvas) -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">FleetPro</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas">.</button>
  </div>
  <div class="offcanvas-body p-0">
    <app-sidebar></app-sidebar>
  </div>
</div>
