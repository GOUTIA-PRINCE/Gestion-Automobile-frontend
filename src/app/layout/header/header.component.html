<div class="bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center">
  <button class="btn btn-outline-secondary d-md-none me-3"
          data-bs-toggle="offcanvas"
          data-bs-target="#mobileSidebar">
    <i class="bi bi-list"></i>.
  </button>

  <div>
    <h5 class="mb-0 fw-bold">Tableau de bord</h5>
    <small class="text-muted">Vue d'ensemble de votre parc automobile</small>
  </div>

  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-outline-secondary" (click)="toggleTheme()">
      <i class="bi" [ngClass]="isDark ? 'bi-sun' : 'bi-moon'"></i>.
    </button>

    <a
      *ngIf="auth.hasPermission('alertes:read')"
      routerLink="/alertes"
      class="notification-link"
      aria-label="Voir les alertes"
    >
      <i class="bi bi-bell fs-5"></i>
      <span *ngIf="alertesActives() > 0" class="notification-badge">
        {{ alertesActives() > 99 ? '99+' : alertesActives() }}
      </span>
    </a>

    <a routerLink="/profil" class="d-flex align-items-center gap-2 text-decoration-none text-dark" *ngIf="auth.currentUser() as user">
      <div class="rounded-circle bg-dark text-white px-2 py-1">{{ initials() }}</div>
      <div class="d-none d-md-block">
        <strong>{{ user.prenom }} {{ user.nom }}</strong><br>
        <small class="text-muted">{{ user.typeUtilisateur }}</small>
      </div>
    </a>
  </div>
</div>
